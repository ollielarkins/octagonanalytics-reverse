# Slack app manifest for the Octagon Coach (28/10/2026).
# Create it at https://api.slack.com/apps -> Create New App -> From a manifest -> pick the Octagon
# workspace -> paste this. Then Install to Workspace, and set two Supabase function secrets yourself:
#   COACH_BOT_TOKEN       Bot User OAuth Token (xoxb-...), from OAuth & Permissions
#   COACH_SIGNING_SECRET  Signing Secret, from Basic Information
# The coach only sends DMs to the people on its pilot list; it never posts in channels.
display_information:
  name: Octagon Coach
  description: Your daily nudges from the Octagon platform, based on your own numbers.
  background_color: "#0f6e56"
features:
  bot_user:
    display_name: Octagon Coach
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://kzcmssldvtjnbwwunuwm.supabase.co/functions/v1/coach-actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
